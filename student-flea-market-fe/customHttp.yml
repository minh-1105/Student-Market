# AWS Amplify Hosting custom headers (Amplify tu doc file nay o app root).
customHeaders:
  - pattern: '**/*'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()

  # File trong _next/static co hash trong ten -> cache vinh vien.
  - pattern: '_next/static/**/*'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable

  # HTML va RSC payload (.txt) phai luon lay ban moi sau moi lan deploy.
  - pattern: '**/*.html'
    headers:
      - key: Cache-Control
        value: public, max-age=0, must-revalidate
  - pattern: '**/*.txt'
    headers:
      - key: Cache-Control
        value: public, max-age=0, must-revalidate
