AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Student Market API - ASP.NET Core (.NET 8) on Lambda behind an API Gateway HTTP API.
  Deploy media-pipeline.yaml first: this stack imports its exports (bucket, CloudFront URL, SNS topic).
  Secrets live in SSM Parameter Store (SecureString) under SsmParameterPath, not in this template.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  MediaStackName:
    Type: String
    Default: student-market-dev-media
    Description: Media stack whose exports (MediaBucketName, CloudFrontBaseUrl, AlertTopicArn) this stack imports.
  SsmParameterPath:
    Type: String
    Default: /student-market/dev/api
    AllowedPattern: '^/[A-Za-z0-9_./-]*[A-Za-z0-9_-]$'
    Description: >-
      SSM path (no trailing slash) loaded into app configuration at cold start. Each SecureString below it maps to a
      config key, e.g. <path>/ConnectionStrings/DefaultConnection, <path>/Jwt/SecretKey, <path>/Email/Password,
      <path>/OriginVerify/Secret. Created by Production/deploy.ps1 from deploy.secrets.env.
  FrontendOrigins:
    Type: String
    Default: http://localhost:3000,http://localhost:5173
    Description: Comma-separated browser origins allowed by API CORS. Use HTTPS origins outside dev.
  SubnetIds:
    Type: CommaDelimitedList
    Default: ''
    Description: Private subnets that can reach RDS. Leave empty when the database is publicly reachable.
  SecurityGroupIds:
    Type: CommaDelimitedList
    Default: ''
    Description: Security groups for the API Lambda (required when SubnetIds is set).
  SkipDatabaseSeed:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: "'false' applies pending EF migrations and seeds admin/categories on cold start. Keep 'true' with Supabase (migrate manually via session pooler)."
  LambdaLogRetentionDays:
    Type: Number
    Default: 14
  EmailUsername:
    Type: String
    Default: ''
    Description: SMTP login (Gmail address). Leave empty to only log emails (OTP) to CloudWatch. Password is in SSM.
  EmailFromEmail:
    Type: String
    Default: no-reply@studentfleamarket.local
    Description: Sender address. A *.local placeholder makes the app send as EmailUsername (Gmail rejects other senders).
  EmailLogOnly:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: "'true' logs emails instead of sending. Forced to 'true' when EmailUsername is empty."
  EmailSmtpHost:
    Type: String
    Default: smtp.gmail.com
  EmailSmtpPort:
    Type: Number
    Default: 587
  ApiThrottleBurstLimit:
    Type: Number
    Default: 50
    MinValue: 1
    Description: HTTP API burst limit (requests) for all routes. Caps cost and Lambda concurrency usage under spam.
  ApiThrottleRateLimit:
    Type: Number
    Default: 20
    MinValue: 1
    Description: HTTP API steady-state limit (requests per second) for all routes.
  GoogleClientId:
    Type: String
    Default: ''
    Description: Google OAuth Web client ID used to verify ID tokens on POST /api/Auth/google (public value). Empty = Google sign-in disabled.
  EnforceOriginVerify:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      'true' rejects /api/* requests without the X-Origin-Verify header that CloudFront adds, so clients must go
      through CloudFront + WAF. Enable only after the frontend uses the CloudFront API URL.

Conditions:
  UseVpc: !Not [!Equals [!Join ['', !Ref SubnetIds], '']]
  HasSmtpCredentials: !Not [!Equals [!Ref EmailUsername, '']]

Globals:
  Function:
    Runtime: dotnet8
    Architectures: [x86_64]

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: ApiLogGroup
    Metadata:
      BuildMethod: dotnet8
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      CodeUri: ../../student-flea-market-be/StudentFleaMarket.API/
      # Executable-assembly hosting (AddAWSLambdaHosting): handler is the assembly name.
      Handler: StudentFleaMarket.API
      MemorySize: 1024
      # HTTP API integration timeout is 30s.
      Timeout: 30
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
      VpcConfig: !If
        - UseVpc
        - SubnetIds: !Ref SubnetIds
          SecurityGroupIds: !Ref SecurityGroupIds
        - !Ref AWS::NoValue
      Environment:
        Variables:
          ASPNETCORE_ENVIRONMENT: Production
          # Secrets (DB connection string, JWT key, SMTP password, origin-verify secret) come from SSM.
          SSM_CONFIG_PATH: !Ref SsmParameterPath
          MediaStorage__BucketName: !ImportValue
            Fn::Sub: '${MediaStackName}-MediaBucketName'
          MediaStorage__Region: !Ref AWS::Region
          MediaStorage__ServiceUrl: ''
          MediaStorage__ForcePathStyle: 'false'
          MediaStorage__CloudFrontBaseUrl: !ImportValue
            Fn::Sub: '${MediaStackName}-CloudFrontBaseUrl'
          Cors__AllowedOrigins: !Ref FrontendOrigins
          SkipDatabaseSeed: !Ref SkipDatabaseSeed
          SkipDemoDataSeed: 'true'
          # appsettings.json defaults Email:LogOnly=true; without these the OTP only reaches CloudWatch.
          Email__Host: !Ref EmailSmtpHost
          Email__Port: !Ref EmailSmtpPort
          Email__UseSsl: 'true'
          Email__Username: !Ref EmailUsername
          Email__FromEmail: !Ref EmailFromEmail
          Email__LogOnly: !If [HasSmtpCredentials, !Ref EmailLogOnly, 'true']
          # Surface SMTP failures as errors instead of silently logging the OTP.
          Email__LogOnFailure: 'false'
          Google__ClientId: !Ref GoogleClientId
          OriginVerify__Enforce: !Ref EnforceOriginVerify
      Policies:
        # Needed only to create ENIs when attached to a VPC; harmless otherwise.
        - AWSLambdaVPCAccessExecutionRole
        - Version: '2012-10-17'
          Statement:
            - Sid: CreatePresignedRawImageUploads
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub
                - 'arn:${AWS::Partition}:s3:::${Bucket}/raw/*'
                - Bucket: !ImportValue
                    Fn::Sub: '${MediaStackName}-MediaBucketName'
            # HeadObject when confirming an upload before saving ItemImage.
            - Sid: VerifyRawImageUploads
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub
                - 'arn:${AWS::Partition}:s3:::${Bucket}/raw/*'
                - Bucket: !ImportValue
                    Fn::Sub: '${MediaStackName}-MediaBucketName'
            - Sid: ReadOwnConfigFromSsm
              Effect: Allow
              Action: ssm:GetParametersByPath
              Resource:
                - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPath}'
                - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPath}/*'
            # SecureString values are encrypted with the AWS managed key aws/ssm; decrypt only through SSM.
            - Sid: DecryptSecureStringsViaSsm
              Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
              Condition:
                StringEquals:
                  kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      # CORS is handled by the ASP.NET Core app (Cors__AllowedOrigins).
      # Throttled requests get 429 from API Gateway and never invoke (or bill) the Lambda.
      DefaultRouteSettings:
        ThrottlingBurstLimit: !Ref ApiThrottleBurstLimit
        ThrottlingRateLimit: !Ref ApiThrottleRateLimit

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: !Ref LambdaLogRetentionDays

  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API Lambda reported errors in five minutes.
      AlarmActions:
        - !ImportValue
          Fn::Sub: '${MediaStackName}-AlertTopicArn'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiBaseUrl:
    Description: API Gateway URL. Pass its host to the media stack as ApiOriginDomain; browsers use <CloudFrontBaseUrl>/api.
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  ApiOriginDomain:
    Value: !Sub '${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  ApiFunctionName:
    Value: !Ref ApiFunction
